[functions."*"]
  external_node_modules = ["express", "@prisma/client"]
  node_bundler = "esbuild"

[functions."chat-stream"]
  included_files = ["server/prompts/core.md"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200  